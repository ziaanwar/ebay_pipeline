name: CI Pipeline Checks

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test_pipeline:
    runs-on: ubuntu-latest

    env:
      SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
      SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
      SNOWFLAKE_PASSWORD: ${{ secrets.SNOWFLAKE_PASSWORD }}
      SNOWFLAKE_ROLE: ${{ secrets.SNOWFLAKE_ROLE }}
      SNOWFLAKE_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE }}
      SNOWFLAKE_DATABASE: ${{ secrets.SNOWFLAKE_DATABASE }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install dbt-snowflake dagster dagster-dbt pytest

      - name: Verify Python Syntax
        run: |
          python -m py_compile repository.py
          python -m py_compile assets/ingestion.py

      - name: Set up dbt profiles.yml
        run: |
          mkdir -p ~/.dbt
          cat <<EOF > ~/.dbt/profiles.yml
          ebay_transform:
            target: dev
            outputs:
              dev:
                type: snowflake
                account: "\"
                user: "\"
                password: "\"
                role: "\"
                warehouse: "\"
                database: "\"
                schema: SILVER
                threads: 4
          EOF

      - name: Test dbt Compile & Parse
        run: |
          cd dbt_projects/ebay_transform
          dbt parse
